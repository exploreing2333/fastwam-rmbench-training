# @package _global_

defaults:
  - override /data: libero_2cam_tmd
  - override /model: tmd
  - _self_

batch_size: 4
num_workers: 2

model:
  mot_checkpoint_mixed_attn: true

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 5000
eval_every: 0

gradient_accumulation_steps: 8
weight_decay: 1e-2
resume: null
